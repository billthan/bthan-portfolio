<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f5">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="{{ "/" | relative_url }}" aria-label="{{ site.title }} home">BT<span>.</span></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="#work">Work</a>
          <a href="#projects">Projects</a>
          <a href="#credentials">Credentials</a>
        </nav>
        <a class="header-link" href="{{ site.socials.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">&nearr;</span></a>
      </div>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>Bill Than <span aria-hidden="true">&middot;</span> Data, platforms, and public impact.</p>
        <div class="site-footer__links">
          <a href="{{ site.socials.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="{{ site.socials.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
      </div>
    </footer>
    <script src="{{ "/assets/js/architecture.js" | relative_url }}" defer></script>
  </body>
</html>
